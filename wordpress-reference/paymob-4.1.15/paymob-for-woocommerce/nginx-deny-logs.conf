# Paymob for WooCommerce — deny public HTTP access to log directories on Nginx.
# .htaccess is ignored by Nginx; include this from your server/site block:
#
#   include /path/to/wp-content/plugins/paymob-for-woocommerce/nginx-deny-logs.conf;
#
location ~* /wp-content/uploads/wc-logs/ {
    deny all;
    return 403;
}

location ~* /wp-content/uploads/paymob-private-logs/ {
    deny all;
    return 403;
}

location ~* /paymob[^/]*\.log$ {
    deny all;
    return 403;
}
