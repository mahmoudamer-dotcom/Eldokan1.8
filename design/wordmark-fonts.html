<style>
/* Layout: a gallery of the footer wordmark, one tile per face, grouped by script family, on the footer's black. */
:root {
  color-scheme: dark;
  --ink: #050505;
  --tile: #0f0f10;
  --tile-hover: #171718;
  --line: #262628;
  --fg: #f4f4f2;
  --muted: #9a9a96;
  --pick: #ffffff;
  --ui: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--ink); color: var(--fg); font-family: var(--ui); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 32px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 32px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
header img { width: 150px; max-width: 100%; height: auto; filter: invert(1); mix-blend-mode: lighten; }
header .copy { flex: 1 1 320px; min-width: 0; }
h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); font-weight: 800; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; max-width: 60ch; }
.group { margin-top: 36px; }
.group h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
.group .note { margin: 0 0 14px; font-size: 13px; color: var(--muted); opacity: 0.8; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tile { position: relative; display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--tile); color: inherit; font: inherit; text-align: inherit; padding: 14px 16px 12px; cursor: pointer; transition: background 160ms ease, border-color 160ms ease; }
.tile:hover { background: var(--tile-hover); }
.tile:focus-visible { outline: 2px solid var(--pick); outline-offset: 3px; }
.tile[aria-pressed="true"] { border-color: var(--pick); background: var(--tile-hover); }
.num { position: absolute; top: 10px; inset-inline-start: 12px; display: grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile[aria-pressed="true"] .num { background: var(--pick); color: var(--ink); border-color: var(--pick); }
.word { display: block; direction: rtl; text-align: center; font-size: 72px; line-height: 1.5; padding-block: 18px 6px; white-space: nowrap; overflow: hidden; text-overflow: clip; }
.meta { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13px; }
.meta b { font-weight: 600; direction: ltr; }
.meta span { color: var(--muted); }
.current { position: absolute; top: 12px; inset-inline-end: 12px; font-size: 11px; color: var(--muted); }
.bar { position: fixed; inset: auto 0 0; z-index: 10; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px 16px; background: rgba(5, 5, 5, 0.94); border-top: 1px solid var(--line); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-size: 15px; }
.bar button { font: inherit; font-weight: 800; border: 0; border-radius: 999px; background: var(--pick); color: var(--ink); padding: 8px 18px; cursor: pointer; }
.bar button:focus-visible { outline: 2px solid var(--pick); outline-offset: 3px; }
.bar [data-say] { font-weight: 800; }
.spacer { height: 80px; }
@media (max-width: 420px) { .word { font-size: 60px; } }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>

  for (const [name, family, weight, current] of group.fonts) {
    n += 1
    const tile = document.createElement('button')
    tile.type = 'button'
    tile.className = 'tile'
    tile.id = 'font-' + n
    tile.setAttribute('aria-pressed', 'false')
    tile.setAttribute('aria-label', `خط رقم ${n}: ${name}`)
    tile.innerHTML = `<span class="num">${n}</span>${current ? `<span class="current">${current}</span>` : ''}<span class="word">الدكان</span><span class="meta"><b></b><span></span></span>`
    const word = tile.querySelector('.word')
    word.style.fontFamily = `'${family}', 'Cairo', serif`
    word.style.fontWeight = weight
    tile.querySelector('.meta b').textContent = name
    tile.querySelector('.meta span').textContent = group.title.split(' (')[0]
    const number = n
    tile.addEventListener('click', () => {
      if (picked) picked.setAttribute('aria-pressed', 'false')
      picked = tile
      tile.setAttribute('aria-pressed', 'true')
      barText.innerHTML = `اخترت الخط رقم <span data-say>${number}</span> (${name}). ابعتلي: «الخط رقم ${number}».`
      copy.hidden = false
      copy.dataset.text = `الخط رقم ${number} (${name})`
    })
    grid.append(tile)
  }
  root.append(section)
}
copy.addEventListener('click', () => {
  const text = copy.dataset.text || ''
  navigator.clipboard?.writeText(text).then(() => { copy.textContent = 'اتنسخ' }, () => { copy.textContent = text })
})
</script>
